name: CI

# Every pull request is tested. A push to main, or a version tag such as v0.2.0, is tested and then
# the two service images that passed are published to the GitHub container registry. A push to main
# then deploys the API image to Cloud Run, if the repository has been connected to a Google Cloud project.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or pull request replaces the run still in progress.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        # The extra index supplies the CPU build of PyTorch; the default Linux wheel
        # bundles GPU libraries the tests never use. Versions still come from requirements.txt.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Run tests
        # Uses the committed mock, example and seasonal-sample data. Tests that need a
        # running PostgreSQL database skip themselves.
        run: python -m unittest discover -s tests

  control-service:
    name: Control service tests (Java)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: control-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and test
        # Tests use an in-memory database with the real migration; the Python API is replaced by a stand-in.
        run: ./mvnw --batch-mode verify

  backend-image:
    name: Docker images
    # Waits for the test jobs, so an image is only ever published from a commit whose tests passed.
    # Builds the Python API image and the Java control service image and runs them together.
    needs: [backend, frontend, control-service]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    env:
      # Not a secret: it protects nothing outside this job's throwaway containers.
      CI_API_KEY: ci-throwaway-key-0123456789abcdef
    steps:
      - uses: actions/checkout@v4

      - name: Build the backend image
        # The labels tie the published image to this repository and to the exact commit it was built from.
        run: |
          docker build -t solar-ai-backend \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.description=Solar Farm AI recommendation API" \
            .

      - name: Start the API container
        run: |
          docker network create solar
          docker run -d --name api --network solar -p 8000:8000 -e SOLAR_API_RATE_LIMIT_PER_MINUTE=0 solar-ai-backend
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/ready; then echo; exit 0; fi
            sleep 2
          done
          docker logs api
          exit 1

      - name: Request a recommendation over HTTP
        run: |
          curl -fsS http://127.0.0.1:8000/models
          echo
          curl -fsS http://127.0.0.1:8000/scenarios
          echo
          curl -fsS -X POST http://127.0.0.1:8000/recommendations -H 'content-type: application/json' -d '{"current_angle_deg": 60}' -o recommendation.json
          python -c "import json; d = json.load(open('recommendation.json')); assert d['decision']['action'] in ('ROTATE', 'HOLD', 'STOW'), d['decision']; print(d['selected_model'], d['decision']['action'], d['decision']['target_angle_deg'])"

      - name: Reject an invalid request
        run: |
          status=$(curl -s -o error.json -w '%{http_code}' -X POST http://127.0.0.1:8000/recommendations -H 'content-type: application/json' -d '{"current_angle_deg": 500}')
          cat error.json; echo
          test "$status" = "422"

      - name: Require the API key when one is set
        # A second API container that requires a key, as a hosted one would.
        run: |
          docker run -d --name api-keyed --network solar -p 8001:8000 -e SOLAR_API_KEY="$CI_API_KEY" solar-ai-backend
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8001/ready; then echo; break; fi
            sleep 2
          done
          request() { curl -s -o keyed.json -w '%{http_code}' -X POST http://127.0.0.1:8001/recommendations -H 'content-type: application/json' "$@" -d '{}'; }
          test "$(request)" = "401"
          cat keyed.json; echo
          test "$(request -H 'x-api-key: not-the-key-0123456789abcdef')" = "401"
          test "$(request -H "x-api-key: $CI_API_KEY")" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8001/models)" = "401"

      - name: Load test the container
        # A short run to prove the script works against the image; the numbers in the README come from a longer local run.
        run: python -m scripts.load_test --requests 300 --concurrency 1 8 --output load_test_ci.json

      - name: Generate one recommendation file with a one-off container
        run: |
          mkdir -p out
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD/out:/out" solar-ai-backend python -m scripts.run_recommendation --skip-lstm --no-llm --output /out/recommendation.json
          python -c "import json; d = json.load(open('out/recommendation.json')); print(d['selected_model'], d['decision']['action'])"

      - name: Build the control service image
        run: |
          docker build -t solar-ai-control-service \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.description=Solar Farm AI control service" \
            control-service

      - name: Start PostgreSQL and the control service container
        # The control service runs here against a real PostgreSQL and the API container that requires a key.
        # The password exists only inside this job's throwaway network.
        run: |
          docker run -d --name db --network solar \
            -e POSTGRES_DB=solar_farm_ai -e POSTGRES_USER=solar_dev -e POSTGRES_PASSWORD=ci-throwaway \
            postgres:17.11-bookworm
          for attempt in $(seq 1 30); do
            if docker exec db pg_isready -h 127.0.0.1 -U solar_dev -d solar_farm_ai; then break; fi
            sleep 2
          done
          docker run -d --name control --network solar -p 8080:8080 \
            -e SOLAR_INFERENCE_URL=http://api-keyed:8000 -e SOLAR_INFERENCE_API_KEY="$CI_API_KEY" \
            -e SOLAR_DB_URL=jdbc:postgresql://db:5432/solar_farm_ai \
            -e SOLAR_DB_USER=solar_dev -e SOLAR_DB_PASSWORD=ci-throwaway \
            solar-ai-control-service
          for attempt in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:8080/actuator/health; then echo; exit 0; fi
            sleep 2
          done
          docker logs control
          exit 1

      - name: Request decisions through the control service
        run: |
          status=$(curl -s -o applied.json -w '%{http_code}' -X POST http://127.0.0.1:8080/api/decisions -H 'content-type: application/json' -d '{}')
          cat applied.json; echo
          test "$status" = "201"
          status=$(curl -s -o whatif.json -w '%{http_code}' -X POST http://127.0.0.1:8080/api/decisions -H 'content-type: application/json' -d '{"currentAngleDeg": 60}')
          cat whatif.json; echo
          test "$status" = "201"
          curl -fsS http://127.0.0.1:8080/api/row -o row.json
          curl -fsS http://127.0.0.1:8080/api/stats -o stats.json
          cat row.json stats.json; echo
          python - <<'PY'
          import json
          applied, whatif = json.load(open("applied.json")), json.load(open("whatif.json"))
          row, stats = json.load(open("row.json")), json.load(open("stats.json"))
          assert applied["action"] in ("ROTATE", "HOLD", "STOW"), applied
          assert applied["appliedToRow"] is True and whatif["appliedToRow"] is False, (applied, whatif)
          # An applied ROTATE or STOW moves the simulated row; a HOLD and a what-if question leave it.
          expected = applied["targetAngleDeg"] if applied["action"] in ("ROTATE", "STOW") else applied["currentAngleDeg"]
          assert row["angleDeg"] == expected, (row, applied)
          assert stats["total"] == 2, stats
          PY

      - name: Reject an invalid request to the control service
        run: |
          status=$(curl -s -o error.json -w '%{http_code}' -X POST http://127.0.0.1:8080/api/decisions -H 'content-type: application/json' -d '{"currentAngleDeg": 500}')
          cat error.json; echo
          test "$status" = "422"

      - name: Restart the control service and check the history survived
        # Proves the history is in PostgreSQL, that the schema check passes on a second start,
        # and that the image's own health check reports healthy.
        run: |
          docker restart control
          for attempt in $(seq 1 60); do
            if [ "$(docker inspect --format '{{.State.Health.Status}}' control)" = "healthy" ]; then break; fi
            sleep 2
          done
          test "$(docker inspect --format '{{.State.Health.Status}}' control)" = "healthy" || { docker logs control; exit 1; }
          curl -fsS http://127.0.0.1:8080/api/stats -o stats.json
          cat stats.json; echo
          python -c "import json; s = json.load(open('stats.json')); assert s['total'] == 2, s"

      - name: Stop the containers
        if: always()
        run: docker rm -f control db api api-keyed || true

      - name: Report image sizes
        run: |
          docker image inspect solar-ai-backend --format 'Backend image {{.Size}} bytes'
          docker image inspect solar-ai-control-service --format 'Control service image {{.Size}} bytes'

      # Delivery: the images that just passed every step above are pushed, never rebuilt ones.
      # Pull requests stop before this point.
      - name: Publish images to the GitHub container registry
        if: github.event_name == 'push'
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          tags=("sha-${GITHUB_SHA::7}")
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then tags+=("$GITHUB_REF_NAME"); else tags+=("latest"); fi
          for pair in "solar-ai-backend=$repository" "solar-ai-control-service=$repository-control-service"; do
            built="${pair%%=*}"
            image="${pair#*=}"
            for tag in "${tags[@]}"; do
              docker tag "$built" "$image:$tag"
              docker push "$image:$tag"
              echo "Published $image:$tag" >> "$GITHUB_STEP_SUMMARY"
            done
          done

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Production build
        run: npm run build

  deploy-api:
    name: Deploy API to Cloud Run
    # Deployment: only from main, only after the image was tested and published, and only once the
    # repository has been connected to a Google Cloud project (see deploy/cloud-run-setup.sh).
    needs: backend-image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.GCP_PROJECT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
      # Lets the job prove to Google Cloud which repository and branch it runs for; no stored cloud key.
      id-token: write
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      RUNTIME_SERVICE_ACCOUNT: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}
      # Names of secrets held in Google Secret Manager, never their values.
      CLOUD_RUN_SECRETS: ${{ vars.CLOUD_RUN_SECRETS }}
      SERVICE: solar-ai-api
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Copy the published image to the project's registry
        # Cloud Run cannot pull from the GitHub registry, so the exact image published above is copied, not rebuilt.
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          source="ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA::7}"
          target="${REGION}-docker.pkg.dev/${PROJECT_ID}/solar-ai/api:sha-${GITHUB_SHA::7}"
          echo "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          docker pull "$source"
          docker tag "$source" "$target"
          docker push "$target"
          echo "IMAGE=$target" >> "$GITHUB_ENV"

      - name: Deploy
        # One instance at most and none when idle, so cost is bounded and an idle service costs nothing.
        # The service is reachable by anyone; the API's own key check is what protects it.
        run: |
          gcloud run deploy "$SERVICE" \
            --image="$IMAGE" --region="$REGION" --project="$PROJECT_ID" \
            --service-account="$RUNTIME_SERVICE_ACCOUNT" \
            --port=8000 --memory=2Gi --cpu=1 --cpu-boost \
            --min-instances=0 --max-instances=1 --concurrency=20 --timeout=60 \
            --set-secrets="$CLOUD_RUN_SECRETS" \
            --allow-unauthenticated --quiet

      - name: Check the deployed API
        run: |
          url="$(gcloud run services describe "$SERVICE" --region="$REGION" --project="$PROJECT_ID" --format='value(status.url)')"
          for attempt in $(seq 1 20); do
            if curl -fsS "$url/ready"; then echo; break; fi
            sleep 5
          done
          curl -fsS "$url/ready" > /dev/null
          # A request with no key must be refused: a deployment that answers it is misconfigured.
          status=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$url/recommendations" -H 'content-type: application/json' -d '{}')
          test "$status" = "401" || { echo "Expected 401 without a key, got $status"; exit 1; }
          echo "Deployed $IMAGE to $url" >> "$GITHUB_STEP_SUMMARY"
