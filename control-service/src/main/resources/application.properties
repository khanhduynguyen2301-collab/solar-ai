spring.application.name=control-service
server.port=8080

# The Python inference API this service calls for every decision.
solar.inference.base-url=${SOLAR_INFERENCE_URL:http://localhost:8000}
solar.inference.connect-timeout=2s
solar.inference.read-timeout=30s

# The one row this prototype controls, and where its SIMULATED position starts.
solar.row.id=row-001
solar.row.initial-angle-deg=35

# Hourly automatic decisions. Off unless switched on, because each run calls the inference API
# and, in live mode, the weather provider.
solar.schedule.enabled=${SOLAR_SCHEDULE_ENABLED:false}
solar.schedule.cron=${SOLAR_SCHEDULE_CRON:0 5 * * * *}
solar.schedule.mode=${SOLAR_SCHEDULE_MODE:live}

# PostgreSQL by default; the "local" profile uses a file database so the service runs with no setup.
spring.datasource.url=${SOLAR_DB_URL:jdbc:postgresql://localhost:5432/solar_farm_ai}
spring.datasource.username=${SOLAR_DB_USER:solar_dev}
spring.datasource.password=${SOLAR_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
server.error.include-message=never
server.error.include-stacktrace=never
