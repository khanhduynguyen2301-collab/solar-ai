spring.application.name=control-service
solar.inference.base-url=http://inference.test
solar.inference.connect-timeout=1s
solar.inference.read-timeout=2s
solar.row.id=row-001
solar.row.initial-angle-deg=35
solar.schedule.enabled=false
solar.schedule.cron=0 5 * * * *
solar.schedule.mode=live
spring.datasource.url=jdbc:h2:mem:control;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
server.error.include-message=never
server.error.include-stacktrace=never
